<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>冒险小队面板</title>
<link rel="stylesheet" href="/party-panel/fonts.css">
<style>
/* Layout: sticky initiative bar on top, responsive grid of character sheets below; each sheet reads HP → slots → resources → conditions → effects */
:root{
  --bg:#E7EAE3; --surface:#F7F8F4; --sunk:#EEF0EA; --ink:#1B2420; --muted:#5D6A63; --line:#CDD3C9;
  --accent:#9B2A1E; --accent-ink:#FFF6F3; --arcane:#3A47B0; --res:#1D7566;
  --good:#2E8640; --warn:#B67F0E; --crit:#C0392B; --buff:#2A7A57; --debuff:#A3366A;
  --shadow:0 1px 0 rgba(27,36,32,.06),0 6px 18px -10px rgba(27,36,32,.25);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A201D; --sunk:#151A17; --ink:#E5EBE4; --muted:#93A098; --line:#2D3631;
  --accent:#E2654F; --accent-ink:#1A0D0A; --arcane:#8E98F3; --res:#4CC1AC;
  --good:#5BC46B; --warn:#E2B23F; --crit:#F06A59; --buff:#5BC593; --debuff:#E27BAA;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201D; --sunk:#151A17; --ink:#E5EBE4; --muted:#93A098; --line:#2D3631;
  --accent:#E2654F; --accent-ink:#1A0D0A; --arcane:#8E98F3; --res:#4CC1AC;
  --good:#5BC46B; --warn:#E2B23F; --crit:#F06A59; --buff:#5BC593; --debuff:#E27BAA;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.02em;margin:0;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.combat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.round{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.round b{font-family:var(--f-num);font-size:18px}
.round span{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.teamsel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;font-weight:600;max-width:min(220px,100%);min-width:0}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk)}
.trow.cur{border-color:var(--accent)}
.trow b{font-family:var(--f-display);font-size:15px;overflow-wrap:anywhere}
.trow p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.trow input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;width:100%;min-width:0}
.trow .group{justify-content:flex-end}
.newteam{display:flex;gap:6px;flex-wrap:wrap}
.newteam input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px}
body.pipdoc .pip-bar{flex-wrap:nowrap;gap:4px;margin-bottom:5px}
.pip-round{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted)}
.pip-round b{font-family:var(--f-num);color:var(--ink);margin-right:1px}
.pbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 7px;font-size:12px;line-height:1.4;color:var(--ink)}
.pbtn:disabled{opacity:.45}
.pbtn.armed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pip-amt{flex:none;width:52px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);padding:2px 5px;font-family:var(--f-num);font-size:12.5px;text-align:center}
body.pipdoc .mini{gap:4px}
body.pipdoc .mrow{padding:6px 8px;gap:6px;grid-template-columns:24px minmax(0,1fr) auto auto}
body.pipdoc .mi-btns button{width:28px;height:28px;font-size:15px}
body.pipdoc .mi-ac b{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.group{display:flex;gap:6px;flex-wrap:wrap}

.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.notice{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;margin-bottom:14px;color:var(--muted);font-size:13px}
.notice strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}

/* character sheet */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .2s}
.card.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.card.down{background:color-mix(in srgb,var(--crit) 6%,var(--surface))}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.init{display:flex;flex-direction:column;align-items:center;gap:2px}
.init-l{font-size:10px;letter-spacing:.08em;color:var(--muted);line-height:1.1}
.init input{text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--sunk);font-family:var(--f-num);-moz-appearance:textfield;appearance:textfield}
.init input::-webkit-inner-spin-button,.init input::-webkit-outer-spin-button,.mi-init::-webkit-inner-spin-button,.mi-init::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.init .init-v{width:52px;height:30px;font-size:16px;font-weight:600;background:var(--surface)}
.init-b{display:flex;gap:2px;width:52px}
.init-b input{width:0;flex:1;font-size:12px;padding:1px 0}
.init-d{flex:none;width:22px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0;font-size:12px;line-height:1}
.init-d:hover{border-color:var(--accent)}
.pending{border-color:var(--warn)!important;background:color-mix(in srgb,var(--warn) 14%,var(--sunk))!important}
.mi-init{width:30px;text-align:center;border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 0;font-family:var(--f-num);font-weight:600;color:var(--muted);-moz-appearance:textfield;appearance:textfield}
.init-handle{display:inline-flex;align-items:center;justify-content:center;cursor:grab;min-height:28px}.init-handle:active{cursor:grabbing}.init-handle .mi-init[readonly]{pointer-events:none}.init-dragging{opacity:.45}.mrow.init-drop-before{box-shadow:inset 0 3px 0 var(--accent)}.mrow.init-drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.mi-init[readonly]{cursor:pointer;caret-color:transparent}.initiative-list{width:100%;grid-column:1/-1}.initiative-list .initiative-row,body.pipdoc .initiative-row{grid-template-columns:40px minmax(0,1fr) auto;padding:10px 12px}.initiative-name{overflow-wrap:anywhere}
.mi-init:hover,.mi-init:focus{border-color:var(--line);background:var(--sunk);color:var(--ink)}
.who{min-width:0}
.who h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.who p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.turn-tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px;font-family:var(--f-body)}
.acbox{display:flex;align-items:center;gap:8px}
.shield{width:46px;height:52px;background:var(--ink);color:var(--surface);clip-path:polygon(50% 0,100% 13%,100% 56%,50% 100%,0 56%,0 13%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:6px}
.shield b{font-family:var(--f-num);font-size:18px;line-height:1}
.shield i{font-style:normal;font-size:9px;letter-spacing:.1em;opacity:.75}
.shield.up{background:var(--buff)} .shield.dn{background:var(--debuff)}
.iconbtn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}

.hp{display:flex;flex-direction:column;gap:6px}
.hp-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hp-cur{font-family:var(--f-num);font-weight:600;font-size:26px;line-height:1}
.hp-max{font-family:var(--f-num);color:var(--muted)}
.temp{font-family:var(--f-num);font-size:12.5px;color:var(--arcane);border:1px solid color-mix(in srgb,var(--arcane) 40%,transparent);border-radius:4px;padding:0 6px}
.status-pill{margin-left:auto;font-size:11.5px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.status-pill.warn{color:var(--warn)} .status-pill.crit{color:var(--crit)} .status-pill.down{background:var(--crit);color:var(--surface)}
.meter{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--good);transition:width .25s}
.meter i.warn{background:var(--warn)} .meter i.crit{background:var(--crit)}
.meter i.tmp{background:var(--arcane);opacity:.55}
.hp-ctl{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px}
.hp-ctl input{min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:5px 8px;font-family:var(--f-num)}
.hp-ctl .dmg{color:var(--crit)} .hp-ctl .heal{color:var(--good)} .hp-ctl .tmpb{color:var(--arcane)}

.ds{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--sunk)}
.ds span{color:var(--muted)}

.sec{display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:6px 12px}
.slot{display:flex;align-items:center;gap:5px}
.slot .lv{font-family:var(--f-num);font-size:11.5px;color:var(--muted);min-width:1.4em}
.pips{display:inline-flex;gap:3px;flex-wrap:wrap}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--c,var(--arcane));background:var(--c,var(--arcane));padding:0}
.pip.spent{background:transparent;opacity:.6}
.pip.sq{border-radius:3px}
.slots .pip{--c:var(--arcane)}
.pact .pip{--c:var(--accent);transform:rotate(45deg);border-radius:2px;width:12px;height:12px;margin:1px}
.res-list{display:flex;flex-direction:column;gap:5px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.res .nm{font-size:13px;overflow-wrap:anywhere}
.res .rs{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;white-space:nowrap}
.res .pip{--c:var(--res)}
.counter{display:inline-flex;align-items:center;gap:4px}
.counter button{width:24px;height:24px;border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:0;line-height:1}
.counter b{font-family:var(--f-num);font-size:13px;min-width:4.5em;text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:12.5px;border:1px solid var(--line);background:var(--sunk)}
.chip.cond{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--ink)}
.chip.cond::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.chip.conc{border-color:var(--arcane);color:var(--arcane)}
.chip.buff{border-color:color-mix(in srgb,var(--buff) 55%,var(--line))}
.chip.buff .k{color:var(--buff)}
.chip.debuff{border-color:color-mix(in srgb,var(--debuff) 55%,var(--line))}
.chip.debuff .k{color:var(--debuff)}
.chip .rd{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.chip .x{border:0;background:transparent;padding:0 0 0 2px;color:var(--muted);font-size:14px;line-height:1}
.chip .x:hover{color:var(--crit)}
.empty-line{font-size:12.5px;color:var(--muted)}
.fx-note{font-size:11.5px;color:var(--muted)}

.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.empty .group{justify-content:center;margin-top:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:min(88vh,100%);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.modal h2{font-family:var(--f-display);font-size:19px;margin:0}
.modal .sub{margin:-8px 0 0;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.field.wide{grid-column:1/-1}
.slotgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.slotgrid div{display:flex;flex-direction:column;align-items:center;gap:2px}
.slotgrid span{font-size:10.5px;color:var(--muted);font-family:var(--f-num)}
.slotgrid input{width:100%;text-align:center;border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:4px 0;font-family:var(--f-num)}
.reslist{display:flex;flex-direction:column;gap:6px}
.resrow{display:grid;grid-template-columns:auto minmax(0,1fr) 64px 76px auto;gap:6px;align-items:center;border-radius:6px}
.mv{display:inline-flex;align-items:center;gap:2px}
.grip{cursor:grab;color:var(--muted);padding:0 2px;font-size:15px;line-height:1;user-select:none}
.grip:active{cursor:grabbing}
.mvb{width:22px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0;font-size:9px;color:var(--muted);line-height:1}
.mvb:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.mvb:disabled{opacity:.3;cursor:default}
.dragging{opacity:.45}
.drop-over{outline:2px dashed var(--accent);outline-offset:2px}
@media (hover:none){.grip{display:none}}
.resrow.dcrow{grid-template-columns:auto minmax(0,1fr) 64px auto}
.dcs{display:flex;flex-wrap:wrap;gap:6px}
.dcb{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--sunk);font-size:12.5px}
.dcb b{font-family:var(--f-num);font-size:15px;color:var(--ink)}
.dcb i{font-style:normal;font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.mi-dc{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.mi-dc b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.resrow input,.resrow select{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:5px 7px;min-width:0;width:100%}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding-top:4px;border-top:1px solid var(--line);padding-block:12px 0}
.mfoot .left{margin-right:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.condentry{position:relative;display:flex;min-width:0}.condentry .cbtn{flex:1;width:100%;overflow-wrap:anywhere}.condentry small{white-space:pre-wrap}.condentry.managing .cbtn b{padding-right:26px}.condentry.menu-open{z-index:3}.cond-more{position:absolute;right:4px;top:4px;width:24px;height:24px;padding:0;border:1px solid transparent;border-radius:5px;background:var(--surface);color:var(--muted);font-size:19px;line-height:1;cursor:pointer}.cond-more:hover,.cond-more[aria-expanded="true"]{border-color:var(--line);color:var(--ink)}.cond-menu{position:absolute;right:4px;top:31px;min-width:112px;max-width:calc(100% - 8px);padding:4px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:var(--shadow)}.cond-menu button{text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:4px;font-size:12.5px}.cond-menu button:hover{background:var(--sunk)}.cond-menu .danger{color:var(--crit)}.cond-tools{gap:4px}.cond-tools .active{border-color:var(--accent);color:var(--accent)}.cond-editor-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cbtn{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.cbtn b{font-size:13.5px}
.cbtn small{font-size:11.5px;color:var(--muted);line-height:1.35}
#autoMapBtn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.cbtn[aria-pressed="true"]{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--sunk))}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sunk);padding:5px 12px}
.seg button[aria-pressed="true"].b{background:var(--buff);color:var(--surface)}
.seg button[aria-pressed="true"].d{background:var(--debuff);color:var(--surface)}
.targets{display:flex;flex-wrap:wrap;gap:6px}
.targets label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk);font-size:13px}
textarea.json{font-family:var(--f-num);font-size:12px;min-height:180px;resize:vertical}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk)}
.citem b{font-family:var(--f-display);font-size:15px}
.citem p{margin:1px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.crow{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.1fr) 64px auto;gap:6px;align-items:end;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.crow .field input,.crow .field select{background:var(--surface)}
.crow .field input:disabled{opacity:.6}
.crow .iconbtn{align-self:end;margin-bottom:2px}
.crow .mv{align-self:end;margin-bottom:2px}

<script>
(function(){
"use strict";
/* ---------- rules data ---------- */
const FULL=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const R=(name,max,reset)=>({id:uid(),name,max,used:0,reset});
const CLASSES={
  barbarian:{n:"野蛮人",hd:12,res:l=>[R("狂暴",l<3?2:l<6?3:l<12?4:l<17?5:6,"long")]},
  bard:{n:"吟游诗人",hd:8,cast:"full",res:l=>[R("诗人激励",3,l>=5?"short":"long")]},
  cleric:{n:"牧师",hd:8,cast:"full",res:l=>l<2?[]:[R("引导神力",l<6?2:l<18?3:4,"short")]},
  druid:{n:"德鲁伊",hd:8,cast:"full",res:l=>l<2?[]:[R("荒野变形",l<6?2:l<17?3:4,"short")]},
  fighter:{n:"战士",hd:10,res:l=>{const a=[R("回气",l<4?2:l<10?3:4,"short")];if(l>=2)a.push(R("动作如潮",l<17?1:2,"short"));if(l>=9)a.push(R("不屈",l<13?1:l<17?2:3,"long"));return a}},
  monk:{n:"武僧",hd:8,res:l=>l<2?[]:[R("气",l,"short")]},
  paladin:{n:"圣武士",hd:10,cast:"half",res:l=>{const a=[R("圣疗池",5*l,"long")];if(l>=3)a.push(R("引导神力",l<11?2:3,"short"));return a}},
  ranger:{n:"游侠",hd:10,cast:"half",res:l=>[R("宿敌（猎人印记）",l<5?2:l<9?3:l<13?4:l<17?5:6,"long")]},
  rogue:{n:"游荡者",hd:8,res:()=>[]},
  sorcerer:{n:"术士",hd:6,cast:"full",res:l=>{const a=[R("先天术法",2,"long")];if(l>=2)a.unshift(R("术法点",l,"long"));return a}},
  warlock:{n:"邪术师",hd:8,cast:"pact",res:l=>[[11,6],[13,7],[15,8],[17,9]].filter(([L])=>l>=L).map(([,s])=>R("秘法奥义·"+s+"环",1,"long"))},
  wizard:{n:"法师",hd:6,cast:"full",res:()=>[R("奥术回复",1,"long")]},
  artificer:{n:"奇械师",hd:8,cast:"half",res:()=>[]}
};
const CONDS=[
  ["目盲","看不见；攻击检定劣势，攻击你的检定有优势"],
  ["魅惑","不能攻击魅惑者；对方社交检定对你有优势"],
  ["耳聋","听不见；依赖听觉的检定自动失败"],
  ["恐慌","看得见恐惧源时，攻击与属性检定劣势，不能主动靠近"],
  ["受擒","速度为 0"],
  ["失能","不能执行动作、附赠动作或反应"],
  ["隐形","攻击检定有优势，攻击你的检定劣势"],
  ["麻痹","失能且不能移动；力量敏捷豁免自动失败，5 尺内命中即重击"],
  ["石化","化为石像，失能；对大多数伤害有抗性"],
  ["中毒","攻击检定与属性检定劣势"],
  ["倒地","只能爬行；攻击劣势；5 尺内攻击你有优势，远程攻击劣势"],
  ["束缚","速度为 0；攻击劣势，攻击你有优势，敏捷豁免劣势"],
  ["震慑","失能；力量敏捷豁免自动失败，攻击你有优势"],
  ["昏迷","失能并倒地；力量敏捷豁免失败，5 尺内命中即重击"]
];
const FX_PRESETS=[
  {name:"祝福",kind:"buff",rounds:10,ac:0,note:"攻击与豁免 +1d4 · 专注"},
  {name:"加速术",kind:"buff",rounds:10,ac:2,note:"速度翻倍，额外动作 · 专注"},
  {name:"护盾术",kind:"buff",rounds:1,ac:5,note:"持续到你下回合开始"},
  {name:"信仰护盾",kind:"buff",rounds:100,ac:2,note:"专注，至多 10 分钟"},
  {name:"狂暴",kind:"buff",rounds:100,ac:0,note:"钝击/穿刺/挥砍抗性，力量伤害加值"},
  {name:"英雄气概",kind:"buff",rounds:10,ac:0,note:"免疫恐慌，每回合获得临时生命 · 专注"},
  {name:"灾祸",kind:"debuff",rounds:10,ac:0,note:"攻击与豁免 −1d4 · 专注"},
  {name:"减速术",kind:"debuff",rounds:10,ac:-2,note:"速度减半，敏捷豁免 −2 · 专注"},
  {name:"妖术",kind:"debuff",rounds:600,ac:0,note:"受到额外 1d6 黯蚀伤害 · 专注"},
  {name:"猎人印记",kind:"debuff",rounds:600,ac:0,note:"受到额外 1d6 伤害 · 专注"},
  {name:"妖火",kind:"debuff",rounds:10,ac:0,note:"攻击它有优势，无法隐形 · 专注"}
];

/* ---------- helpers ---------- */
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const int=(v,d=0)=>{const n=parseInt(v,10);return Number.isFinite(n)?n:d};
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);

function slotsFor(cast,l){
  if(cast==="full")return pad(FULL[clamp(l,0,20)]);
  if(cast==="half")return pad(FULL[Math.ceil(clamp(l,0,20)/2)]);
  if(cast==="third")return pad(l<3?[]:FULL[Math.ceil(clamp(l,0,20)/3)]);
  return pad([]);
}
function pad(a){const r=a.slice();while(r.length<9)r.push(0);return r}
function pactFor(l){return {lvl:Math.min(5,Math.ceil(l/2)),max:l<2?1:l<11?2:l<17?3:4,used:0}}

function blank(){
  return {name:"新角色",cls:"",level:1,hp:10,maxHp:10,temp:0,ac:10,init:0,
    slots:pad([]),used:pad([]),pact:{lvl:0,max:0,used:0},res:[],conds:[],exh:0,fx:[],conc:"",ds:{s:0,f:0},created:Date.now()};
}
function normalize(c){
  const b=blank();const o=Object.assign(b,c||{});
  o.slots=pad((o.slots||[]).slice(0,9).map(n=>clamp(int(n),0,9)));
  o.used=pad((o.used||[]).slice(0,9).map(n=>Math.max(0,int(n))));
  o.used=o.used.map((u,i)=>clamp(u,0,o.slots[i]));
  o.spUsed=clamp(int(o.spUsed),0,spMax(o));
  o.spHigh=(Array.isArray(o.spHigh)?o.spHigh:[]).map(n=>int(n)).filter(n=>n>=6&&n<=9);
  o.pact=Object.assign({lvl:0,max:0,used:0},o.pact||{});o.pact.used=clamp(int(o.pact.used),0,int(o.pact.max));
  o.res=(o.res||[]).map(r=>({id:r.id||uid(),name:String(r.name||"资源"),max:Math.max(0,int(r.max)),used:clamp(int(r.used),0,Math.max(0,int(r.max))),reset:r.reset==="short"?"short":r.reset==="none"?"none":"long"}));
  o.fx=(o.fx||[]).map(f=>({id:f.id||uid(),name:String(f.name||"效果"),kind:f.kind==="debuff"?"debuff":"buff",rounds:f.rounds==null||f.rounds===""?null:Math.max(0,int(f.rounds)),ac:int(f.ac),note:String(f.note||"")}));
  o.conds=Array.isArray(o.conds)?o.conds.filter(x=>typeof x==="string"):[];
  const notes=Object.create(null);for(const n of o.conds){if(o.condNotes&&typeof o.condNotes[n]==="string")notes[n]=o.condNotes[n].slice(0,2000)}o.condNotes=notes;
  o.ds=Object.assign({s:0,f:0},o.ds||{});
  const cl=Array.isArray(o.concs)?o.concs:(o.conc?[o.conc]:[]);
  o.concs=[...new Set(cl.map(s=>String(s).trim()).filter(Boolean))].slice(0,9);
  o.conc=o.concs[0]||"";
  o.concMax=clamp(int(o.concMax,1),1,9);
  o.init=int(o.init);o.initBonus=clamp(int(o.initBonus),-20,30);o.initAdv=o.initAdv===true||o.initAdv==="1";o.initManual=o.initManual===true||o.initManual==="1";o.initPending=o.initPending===true;
  o.dcs=(Array.isArray(o.dcs)?o.dcs:[]).slice(0,12).map(x=>({id:x.id||uid(),name:String(x.name||"").slice(0,30),val:clamp(int(x.val,10),0,40)}));
  o.initRoll=Array.isArray(o.initRoll)?o.initRoll.map(n=>clamp(int(n),1,20)).slice(0,2):[];
  o.hp=clamp(int(o.hp),0,Math.max(1,int(o.maxHp,1)));o.maxHp=Math.max(1,int(o.maxHp,1));
  o.temp=Math.max(0,int(o.temp));o.exh=clamp(int(o.exh),0,6);
  return o;
}
/* spell points variant (DMG): point pool equals the slot table's cost total */
const SP_COST=[0,2,3,5,6,7,9,10,11,13];
function spMax(c){return (c.slots||[]).reduce((s,n,i)=>s+(int(n)||0)*SP_COST[i+1],0)}
function spTop(c){let t=0;(c.slots||[]).forEach((n,i)=>{if(n>0)t=i+1});return t}
function usePoints(){return S.meta.spellSystem==="points"}
/* concentration (standard: one at a time; variant: per-character limit) */
function multiConc(){return S.meta.multiConc===true}
function concLimit(c){return multiConc()?c.concMax:1}
function addConc(c,name){
  name=String(name||"").trim();if(!name||c.concs.includes(name))return;
  const ended=[];while(c.concs.length>=concLimit(c))ended.push(c.concs.shift());
  c.concs.push(name);c.conc=c.concs[0];
  if(ended.length)toast(c.name+" 开始专注「"+name+"」，"+(concLimit(c)>1?"已达上限 "+concLimit(c)+" 个，":"")+"「"+ended.join("」「")+"」的专注结束。");
}
function effAC(c){return c.ac+c.fx.reduce((s,f)=>s+(f.ac||0),0)}
function clsName(c){const C=getClass(c.cls);return C?C.n:(c.clsLabel||"")}

/* custom classes */
const CAST_LABEL={none:"非施法者",full:"全施法者",half:"半施法者",third:"三分之一施法者",pact:"契约魔法"};
const MODE_LABEL={fixed:"固定值",level:"等级 ×",prof:"熟练加值",table:"等级表"};
const RESET_LABEL={short:"短休",long:"长休",none:"手动"};
function prof(l){return 2+Math.floor((clamp(l,1,20)-1)/4)}
function parseTable(s){
  return String(s||"").split(/[,，;；\s]+/).map(p=>p.split(/[:：=]/)).filter(p=>p.length===2).map(([a,b])=>[int(a,NaN),int(b,NaN)]).filter(([a,b])=>Number.isFinite(a)&&Number.isFinite(b)).sort((x,y)=>x[0]-y[0]);
}
function resMax(r,l){
  if(l<(r.from||1))return null;
  if(r.mode==="level")return Math.max(1,Math.floor(l*(parseFloat(r.val)||1)));
  if(r.mode==="prof")return prof(l);
  if(r.mode==="table"){let v=null;for(const[a,b]of parseTable(r.val))if(a<=l)v=b;return v}
  return Math.max(0,int(r.val));
}
function normalizeClass(c){
  c=c||{};
  return {name:String(c.name||"新职业").slice(0,40),hd:[0,6,8,10,12].includes(int(c.hd))?int(c.hd):8,
    cast:CAST_LABEL[c.cast]?c.cast:"none",note:String(c.note||""),created:c.created||Date.now(),
    res:(Array.isArray(c.res)?c.res:[]).map(r=>({id:r.id||uid(),name:String(r.name||"资源"),reset:RESET_LABEL[r.reset]?r.reset:"long",
      mode:MODE_LABEL[r.mode]?r.mode:"fixed",val:r.mode==="table"?String(r.val??""):(r.val??1),from:clamp(int(r.from,1),1,20)}))};
}
function getClass(k){
  if(!k)return null;
  if(CLASSES[k])return CLASSES[k];
  if(k.startsWith("x:")){
    const c=S.classes[k.slice(2)];if(!c)return null;
    return {n:c.name,hd:c.hd,cast:c.cast,custom:true,
      res:l=>c.res.map(r=>{const m=resMax(r,l);return m==null||m<=0?null:R(r.name,m,r.reset)}).filter(Boolean)};
  }
  return null;
}
function classSummary(c){
  const bits=[c.hd?"生命骰 d"+c.hd:"",CAST_LABEL[c.cast]];
  if(c.res.length)bits.push(c.res.map(r=>r.name).join("、"));
  return bits.filter(Boolean).join(" · ");
}

/* ---------- state & storage ---------- */
const S={chars:{},classes:{},teams:{},team:null,teamSaved:{},meta:defMeta(),ready:false};
function defMeta(){return {round:0,turn:null,sortInit:true,spellSystem:"slots",multiConc:false}}
let db=null,mode="local",readOnly=false,unsubMembers=null;
const LS_KEY="dnd-party-tracker-v1",TEAM_KEY="dnd-active-team";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const COND_LIBRARY_KEY="dnd-condition-library-v1";
function cleanCondLibrary(data){
  if(!Array.isArray(data))throw Error("状态库应为数组");

/* shared mode: writes are queued per document path, captured at the moment of change */
const dirty=new Map(),inflight=new Set();let flushT=null;
function busy(path){return dirty.has(path)||inflight.has(path)}
function teamDoc(tid){const t=S.teams[tid];return t?{name:t.name,created:t.created,meta:clone(t.meta)}:null}
function pathFor(key){
  if(key==="meta")key="team:"+S.team;
  if(key.startsWith("team:")){const tid=key.slice(5);return ["teams/"+tid,teamDoc(tid)]}
  if(key.startsWith("k:")){const cid=key.slice(2),k=S.classes[cid];return ["classes/"+cid,k?clone(k):null]}
  if(key.startsWith("m:")){const p=key.split(":");return ["teams/"+p[1]+"/members/"+p[2],null]}
  const c=S.chars[key];return ["teams/"+S.team+"/members/"+key,c?clone(c):null];
}
function persist(key){
  if(mode==="local"){saveLocal();return}
  const [path,data]=pathFor(key);
  dirty.set(path,data);
  const m=path.match(/^teams\/([^/]+)\/members\//);
  if(m&&data&&!S.teamSaved[m[1]]&&S.teams[m[1]]){S.teamSaved[m[1]]=true;dirty.set("teams/"+m[1],teamDoc(m[1]))}
  if(/^teams\/[^/]+$/.test(path)&&data)S.teamSaved[path.slice(6)]=true;
  clearTimeout(flushT);flushT=setTimeout(flush,320);
}
function flush(){
  for(const [path,data] of [...dirty]){
    if(inflight.has(path))continue;
    dirty.delete(path);inflight.add(path);
    (data?db.doc(path).set(data):db.doc(path).delete())
      .catch(e=>onWriteErr(e,path,data))
      .finally(()=>{inflight.delete(path);if(dirty.has(path)){clearTimeout(flushT);flushT=setTimeout(flush,200)}});
  }
}
const retried=new Set();
function onWriteErr(e,path,data){
  const code=e&&e.code;
  if(code==="invalid_argument"&&!readOnly){readOnly=true;renderNotices();toast("你在这个页面上只有查看权限，修改不会被保存。");return}
  if(code==="quota_exceeded"){toast("存储空间已满，请删除一些角色或小队后再试。");return}
  if((code==="unavailable"||!code)&&!retried.has(path)){retried.add(path);setTimeout(()=>{retried.delete(path);if(!dirty.has(path))dirty.set(path,data);clearTimeout(flushT);flushT=setTimeout(flush,50)},600+Math.random()*900);return}
  toast("保存失败（"+(code||"未知错误")+"），请稍后重试。");
}

async function migrateLegacy(){

    const ms=await db.doc("meta/combat").get();

}

/* ---------- mutations ---------- */
function guard(){if(readOnly){toast("你只能查看这个小队。");return false}return true}
function mutate(id,fn){if(!guard())return;const c=S.chars[id];if(!c)return;fn(c);S.chars[id]=normalize(c);persist(id);render()}
function setMeta(patch){if(!guard())return;Object.assign(S.meta,patch);persist("meta");render()}
function removeChar(id){if(!guard())return;delete S.chars[id];if(S.meta.turn===id)S.meta.turn=null;persist(id);persist("meta");render()}

function sortedIds(){
  const ids=Object.keys(S.chars);
  return ids.sort((a,b)=>{const A=S.chars[a],B=S.chars[b];
    if(S.meta.sortInit!==false&&A.initPending!==B.initPending)return A.initPending?1:-1;
    if(S.meta.sortInit!==false&&B.init!==A.init)return B.init-A.init;
    if(S.meta.sortInit!==false&&B.initBonus!==A.initBonus)return B.initBonus-A.initBonus;
    return (A.created||0)-(B.created||0)||A.name.localeCompare(B.name)});
}

/* initiative: 1d20 + bonus (advantage rolls two and keeps the higher) */
function d20(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%20+1}catch(e){return Math.floor(Math.random()*20)+1}}
function sgn(n){return (n>=0?"+":"−")+Math.abs(n)}
function rollInit(c){
  const d=[d20()];if(c.initAdv)d.push(d20());
  c.initRoll=d;c.init=Math.max(...d)+c.initBonus;c.initPending=false;
  return c.name+" "+c.init+"（d20 "+d.join("/")+" "+sgn(c.initBonus)+"）";
}
function initDetail(c){return c.initRoll.length?"d20 "+c.initRoll.join("/")+" "+sgn(c.initBonus):""}
function rollAll(){
  if(!guard())return;
  const ids=Object.keys(S.chars);if(!ids.length)return;
  const manual=[];
  ids.forEach(id=>{const c=S.chars[id];if(c.initManual){c.initPending=true;manual.push(c.name)}else rollInit(c);persist(id)});
  render();
  const rolled=sortedIds().filter(id=>!S.chars[id].initPending);
  toast((rolled.length?"先攻："+rolled.map(id=>S.chars[id].name+" "+S.chars[id].init).join("，"):"没有需要自动掷骰的角色")+(manual.length?"。待手动填写："+manual.join("、"):""));
}
function applyDamage(c,n){
  let left=n;const absorbed=Math.min(c.temp,left);c.temp-=absorbed;left-=absorbed;
  const before=c.hp;c.hp=Math.max(0,c.hp-left);
  const msgs=[];
  const dc=Math.min(30,Math.max(10,Math.floor(n/2)));
  if(c.concs.length&&n>0&&c.hp>0)msgs.push(c.name+" 受到 "+n+" 点伤害，需进行专注检定（体质豁免 DC "+dc+"）以维持「"+c.concs.join("」「")+"」"+(c.concs.length>1?"，共 "+c.concs.length+" 个专注":"")+"。");
  if(before>0&&c.hp===0){
    msgs.push(c.name+" 倒下了，开始死亡豁免。");
    if(c.concs.length){msgs.push(c.name+" 失去意识，「"+c.concs.join("」「")+"」的专注结束。");c.concs=[];c.conc=""}
    if(left-before>=c.maxHp)msgs.push("溢出伤害不低于生命上限：按规则直接死亡。");
  }
  else if(before===0&&n>0){c.ds.f=Math.min(3,c.ds.f+1);msgs.push(c.name+" 在濒死时受到伤害，记一次死亡豁免失败。")}
  return msgs;
}
function nextTurn(){
  if(!guard())return;
  const ids=sortedIds();if(!ids.length)return;
  let i=ids.indexOf(S.meta.turn);
  if(S.meta.round<1||i<0){S.meta.round=Math.max(1,S.meta.round||0);S.meta.turn=ids[0];persist("meta");render();return}
  if(i+1<ids.length){S.meta.turn=ids[i+1];persist("meta");render();return}
  // round wraps: tick effects
  const expired=[];
  for(const id of ids){
    const c=S.chars[id];let changed=false;
    c.fx=c.fx.filter(f=>{if(f.rounds==null)return true;changed=true;f.rounds-=1;if(f.rounds<=0){expired.push(c.name+"的「"+f.name+"」");return false}return true});
    if(changed)persist(id);
  }
  S.meta.round+=1;S.meta.turn=ids[0];persist("meta");render();
  toast("进入第 "+S.meta.round+" 轮"+(expired.length?"。已结束："+expired.join("、"):""));
}

}

/* ---------- rendering ---------- */
function pipRow(max,used,act,extra,cls){

  }

  for(let j=0;j<max;j++){const avail=j<max-used,isDS=act==="ds";h+=`<button class="pip ${cls||""} ${avail?"":"spent"}" aria-label="${isDS?(avail?"撤销一次记录":"记录一次死亡豁免"):avail?"使用":"恢复"}" ${isDS?`aria-pressed="${avail}"`:""} data-act="${act}" ${extra} data-d="${isDS?(avail?-1:1):(avail?1:-1)}"></button>`}
  return h+`</span>`;
}
function spellBlock(c,compact){

  return h;
}
function card(id,c){

function tagBits(c,withSpells){
  const t=[];
  if(withSpells){
    c.dcs.forEach(x=>t.push(["m",(x.name?x.name+" ":"")+"DC"+x.val]));
    if(c.slots.some(n=>n>0)){
      if(usePoints())t.push(["m","法术点 "+(spMax(c)-c.spUsed)+"/"+spMax(c)]);
      else c.slots.forEach((m,i)=>{if(m)t.push(["m",(i+1)+"环 "+(m-c.used[i])+"/"+m])});
    }
    if(c.pact.max)t.push(["m","契约"+c.pact.lvl+"环 "+(c.pact.max-c.pact.used)+"/"+c.pact.max]);
  }
  c.concs.forEach(n=>t.push(["k","专注·"+n]));
  c.conds.forEach(n=>t.push(["c",n]));
  if(c.exh)t.push(["c","力竭"+c.exh]);
  c.fx.forEach(f=>t.push([f.kind==="buff"?"b":"d",(f.kind==="buff"?"▲":"▼")+f.name+(f.rounds==null?"":" "+f.rounds)]));
  return t;
}

async function togglePip(){

  if(pip.active){try{if(document.pictureInPictureElement)await document.exitPictureInPicture()}catch(e){}stopPip();return}
  if(canDocPip()){
    try{await openDocPip();return}catch(e){/* fall through to the view-only window */}
  }
  const v=document.createElement("video");
  if(!document.pictureInPictureEnabled||typeof v.requestPictureInPicture!=="function"||!HTMLCanvasElement.prototype.captureStream){
    pipFallback("这个浏览器不支持置顶悬浮窗（需要桌面版 Chrome、Edge 或 Safari）。");return;
  }
  try{
    pip.canvas=document.createElement("canvas");pip.ctx=pip.canvas.getContext("2d");pip.active=true;drawPip();
    pip.stream=pip.canvas.captureStream();
    v.className="pipvid";v.muted=true;v.playsInline=true;v.srcObject=pip.stream;document.body.appendChild(v);pip.video=v;
    drawPip();

    await v.requestPictureInPicture();
    v.addEventListener("leavepictureinpicture",stopPip,{once:true});

      navigator.mediaSession.metadata=new MediaMetadata({title:"冒险小队面板",artist:"⏭ 下一位 · ⏮ 上一位"});
      navigator.mediaSession.setActionHandler("nexttrack",()=>nextTurn());

      navigator.mediaSession.setActionHandler("play",()=>v.play());
      navigator.mediaSession.setActionHandler("pause",()=>v.play());
    }catch(e){}
    toast("已打开只读悬浮窗，⏭ / ⏮ 可切换行动角色。网页嵌在 Claude 里时浏览器不允许悬浮窗内点击编辑；要直接在悬浮窗里改数据，请用离线版文件打开。");

      else if(t.dataset.delres!=null){d.res.splice(+t.dataset.delres,1);draw(root)}
      else if(t.hasAttribute("data-del")){if(!delArm){delArm=true;draw(root)}else{modalClose();const n=S.chars[id].name;removeChar(id);toast("已删除 "+n)}}
      else if(t.hasAttribute("data-save")){
        if(!guard())return;
        if(!d.name.trim())d.name="无名角色";
        if(d.cls&&d.cls.startsWith("x:")&&S.classes[d.cls.slice(2)])d.clsLabel=S.classes[d.cls.slice(2)].name;
        if(!isNew&&S.chars[id]&&int(d.init)!==S.chars[id].init)d.initPending=false;
        const c=normalize(d);
        if(isNew){const nid="c"+uid();c.created=Date.now();S.chars[nid]=c;persist(nid)}
        else{S.chars[id]=c;persist(id)}
        modalClose();render();
      }
    });
  });
}

/* reorder resource rows: ▲▼ buttons everywhere, drag handle with a mouse */
function moveCtl(i,n,list){
  list=list||"res";
  return `<span class="mv"><span class="grip" draggable="true" data-grip="${i}" data-list="${list}" title="拖动调整顺序">⠿</span><button type="button" class="mvb" data-mv="${i}" data-list="${list}" data-dir="-1" ${i===0?"disabled":""} aria-label="上移" title="上移">▲</button><button type="button" class="mvb" data-mv="${i}" data-list="${list}" data-dir="1" ${i===n-1?"disabled":""} aria-label="下移" title="下移">▼</button></span>`;
}
function moveItem(arr,from,to){if(from===to||from<0||to<0||from>=arr.length||to>=arr.length)return false;const [x]=arr.splice(from,1);arr.splice(to,0,x);return true}
function bindReorder(root,getArr,redraw){
  root.addEventListener("click",e=>{
    const b=e.target.closest("[data-mv]");if(!b||b.disabled)return;
    const i=int(b.dataset.mv),j=i+int(b.dataset.dir),L=b.dataset.list||"res";
    if(moveItem(getArr(L),i,j)){redraw();const nb=root.querySelector(`[data-list="${L}"][data-mv="${j}"][data-dir="${b.dataset.dir}"]`)||root.querySelector(`[data-list="${L}"][data-mv="${j}"]`);nb&&!nb.disabled&&nb.focus()}
  });
  let from=-1,fromList="res";
  const rowOf=el=>el&&el.closest?el.closest(".resrow,.crow"):null;
  const clear=()=>root.querySelectorAll(".drop-over,.dragging").forEach(x=>x.classList.remove("drop-over","dragging"));
  root.addEventListener("dragstart",e=>{
    const g=e.target.closest&&e.target.closest("[data-grip]");if(!g)return;
    from=int(g.dataset.grip);fromList=g.dataset.list||"res";try{e.dataTransfer.setData("text/plain",String(from));e.dataTransfer.effectAllowed="move";const r=rowOf(g);r&&e.dataTransfer.setDragImage(r,12,16)}catch(x){}
    const r=rowOf(g);r&&r.classList.add("dragging");
  });
  root.addEventListener("dragover",e=>{if(from<0)return;const r=rowOf(e.target);const rg=r&&r.querySelector("[data-grip]");if(!rg||(rg.dataset.list||"res")!==fromList)return;e.preventDefault();root.querySelectorAll(".drop-over").forEach(x=>x!==r&&x.classList.remove("drop-over"));r.classList.add("drop-over")});
  root.addEventListener("drop",e=>{
    if(from<0)return;const r=rowOf(e.target);if(!r)return;e.preventDefault();
    const g=r.querySelector("[data-grip]");const to=g&&(g.dataset.list||"res")===fromList?int(g.dataset.grip):-1;
    const f=from;from=-1;clear();
    if(moveItem(getArr(fromList),f,to))redraw();
  });
  root.addEventListener("dragend",()=>{from=-1;clear()});
}

/* custom class manager */
function usersOf(cid){return Object.keys(S.chars).filter(k=>S.chars[k].cls==="x:"+cid)}
function classesModal(){
  const list=Object.entries(S.classes).sort((a,b)=>a[1].created-b[1].created);
  openModal(`<h2>自定义职业</h2><p class="sub">为自制职业、子职业或第三方职业建立模板：设定生命骰、施法方式和随等级变化的职业资源。建好后在角色编辑里选择它，再点「按职业与等级填充」。</p>
    <div class="clist">${list.length?list.map(([k,c])=>{const n=usersOf(k).length;return `<div class="citem"><div><b>${esc(c.name)}</b><p>${esc(classSummary(c))}${n?" · "+n+" 名角色在用":""}</p></div><button class="btn sm" data-ed="${k}">编辑</button></div>`}).join(""):`<p class="hint">还没有自定义职业。</p>`}</div>
    <div class="mfoot"><button class="btn ghost" data-x>关闭</button><button class="btn primary" data-new>＋ 新建职业</button></div>`,root=>{
    root.querySelector("[data-x]").onclick=modalClose;
    root.querySelector("[data-new]").onclick=()=>{if(guard())classEditModal(null,()=>classesModal(),()=>classesModal())};
    root.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>classEditModal(b.dataset.ed,()=>classesModal(),()=>classesModal()));
  });
}
function syncChars(cid,oldNames){
  const C=getClass("x:"+cid);if(!C)return 0;
  const ids=usersOf(cid);
  for(const id of ids){
    const c=S.chars[id],l=clamp(c.level,1,20);
    const fresh=C.res(l).concat(C.hd?[R("生命骰 d"+C.hd,l,"long")]:[]);
    const freshNames=new Set(fresh.map(r=>r.name));
    fresh.forEach(r=>{const o=c.res.find(x=>x.name===r.name);if(o){r.id=o.id;r.used=Math.min(o.used,r.max)}});
    const extras=c.res.filter(r=>!freshNames.has(r.name)&&!oldNames.has(r.name)&&!/^生命骰 d\d+$/.test(r.name));
    c.res=fresh.concat(extras);
    const ns=slotsFor(C.cast,l);c.used=c.used.map((u,i)=>Math.min(u,ns[i]));c.slots=ns;
    if(C.cast==="pact"){const p=pactFor(l);p.used=Math.min(c.pact.used,p.max);c.pact=p}else c.pact={lvl:0,max:0,used:0};
    c.clsLabel=C.n;
    S.chars[id]=normalize(c);persist(id);
  }
  return ids.length;
}
function classEditModal(cid,onSave,onCancel){
  const isNew=!cid;

  const d=clone(isNew?normalizeClass({name:"",hd:8,cast:"none",res:[]}):S.classes[cid]);
  const oldNames=new Set(isNew?[]:d.res.map(r=>r.name));
  const users=isNew?[]:usersOf(cid);
  let pl=5,delArm=false,sync=users.length>0;
  const previewHTML=()=>{
    const C={hd:d.hd,cast:d.cast};
    const sl=slotsFor(d.cast,pl).map((n,i)=>n?`${i+1}环×${n}`:"").filter(Boolean);
    const items=[];
    if(sl.length)items.push(`<li>法术位 <span>${sl.join(" ")}</span></li>`);
    if(d.cast==="pact"){const p=pactFor(pl);items.push(`<li>契约法术位 <span>${p.lvl}环×${p.max}</span></li>`)}
    d.res.forEach(r=>{const m=resMax(r,pl);if(m!=null&&m>0)items.push(`<li>${esc(r.name)} <span>${m} 次 · ${RESET_LABEL[r.reset]}</span></li>`)});
    if(C.hd)items.push(`<li>生命骰 d${C.hd} <span>${pl} 颗 · 长休</span></li>`);
    return items.length?`<ul>${items.join("")}</ul>`:`<p class="hint">这个等级没有可追踪的资源。</p>`;
  };
  const valInput=(r,i)=>{
    if(r.mode==="prof")return `<input aria-label="数值" disabled value="自动">`;
    if(r.mode==="table")return `<input aria-label="等级表" data-r="${i}" data-rk="val" value="${esc(r.val)}" placeholder="1:2, 6:3, 12:4">`;
    return `<input aria-label="数值" type="number" ${r.mode==="level"?'step="0.5" min="0.5"':'min="0"'} data-r="${i}" data-rk="val" value="${esc(r.val)}">`;
  };
  const draw=root=>{
    root.innerHTML=`<h2>${isNew?"新建自定义职业":"编辑自定义职业"}</h2>
    <div class="fields">
      <div class="field wide"><label for="k-name">职业名称</label><input id="k-name" data-k="name" value="${esc(d.name)}" placeholder="如 血猎手、符文骑士"></div>
      <div class="field"><label for="k-hd">生命骰</label><select id="k-hd" data-k="hd">${[0,6,8,10,12].map(n=>`<option value="${n}" ${d.hd===n?"selected":""}>${n?"d"+n:"不追踪"}</option>`).join("")}</select></div>
      <div class="field" style="grid-column:span 2"><label for="k-cast">施法方式</label><select id="k-cast" data-k="cast">${Object.entries(CAST_LABEL).map(([k,v])=>`<option value="${k}" ${d.cast===k?"selected":""}>${v}${k==="full"?"（法师式）":k==="half"?"（圣武士式，1 级起）":k==="third"?"（奥法骑士式，3 级起）":k==="pact"?"（邪术师式，短休恢复）":""}</option>`).join("")}</select></div>
    </div>
    <div class="sec"><div class="sec-h"><h3>职业资源</h3><button class="btn sm" data-addres>＋ 资源</button></div>
      <div class="reslist">${d.res.map((r,i)=>`<div class="crow">${moveCtl(i,d.res.length)}
        <div class="field c-name"><label>名称</label><input data-r="${i}" data-rk="name" value="${esc(r.name)}"></div>
        <div class="field"><label>恢复</label><select data-r="${i}" data-rk="reset">${Object.entries(RESET_LABEL).map(([k,v])=>`<option value="${k}" ${r.reset===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label>次数计算</label><select data-r="${i}" data-rk="mode">${Object.entries(MODE_LABEL).map(([k,v])=>`<option value="${k}" ${r.mode===k?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label>${r.mode==="table"?"等级:次数":r.mode==="level"?"系数":"数值"}</label>${valInput(r,i)}</div>
        <div class="field c-from"><label>起始等级</label><input type="number" min="1" max="20" data-r="${i}" data-rk="from" value="${r.from}"></div>
        <button class="iconbtn" data-delres="${i}" aria-label="删除资源">×</button>
      </div>`).join("")||`<p class="hint">还没有资源。比如「血之诅咒 · 熟练加值 · 长休」，或「符文充能 · 等级表 3:2, 7:3, 15:4 · 短休」。</p>`}</div>
      <p class="hint">固定值：每级相同。等级 ×：等级乘以系数，0.5 即半级向下取整。熟练加值：随等级 +2 到 +6。等级表：写成「等级:次数」，从该等级起生效。起始等级之前该资源不出现。</p>
    </div>
    <div class="preview"><div class="row"><b>预览</b><input type="range" min="1" max="20" value="${pl}" data-pl aria-label="预览等级"><span class="num">${pl} 级</span></div><div data-pv>${previewHTML()}</div></div>

  openModal("",root=>{

      refreshPreview(root);

    root.addEventListener("change",e=>{

      if(t.dataset.rk==="mode"){const r=d.res[+t.dataset.r];r.val=r.mode==="table"?"1:2":r.mode==="level"?1:r.mode==="fixed"?1:"";draw(root)}
      if(t.dataset.k==="cast"||t.dataset.k==="hd")refreshPreview(root);

        if(!delArm){delArm=true;draw(root);return}

        delete S.classes[cid];persist("k:"+cid);modalClose();render();toast("已删除职业「"+name+"」，使用它的角色保留现有资源。");onCancel&&onCancel();
      }

        onSave&&onSave(id);
      }
    });
  });
}

      else if(t.dataset.mc){const on=t.dataset.mc==="1";if(on!==multiConc()){setMeta({multiConc:on});toast(on?"已开启多重专注变体。":"已恢复标准专注规则。")}draw(root)}
      else if(t.dataset.sys){const want=t.dataset.sys;if((want==="points")!==usePoints()){setMeta({spellSystem:want});toast(want==="points"?"已切换到法术点变体规则。":"已切换回标准法术位。")}draw(root)}
    });
  });
}

/* conditions modal */
function condModal(id,doc=document){
  let pending="",customPending="",summaryPending="",deletePending=null,managing=false,menuName=null,editorOpen=false;
  const draw=root=>{
    const c=S.chars[id];if(!c){modalClose();return}
    const lim=concLimit(c),multi=multiConc();
    root.innerHTML=`<h2>${esc(c.name)} 的状态</h2><p class="sub">点选状态为当前角色添加 / 移除。状态库供本浏览器所有小队和角色共用；删除资料不会移除角色已有的状态。</p>
    <div class="sec-h"><h3>状态库</h3><div class="group cond-tools"><button class="btn sm ghost" data-editor aria-expanded="${editorOpen}">${editorOpen?"收起表单":"＋ 新增"}</button><button class="btn sm ghost ${managing?"active":""}" data-managelib aria-pressed="${managing}">${managing?"完成管理":"管理"}</button>${managing?`<button class="btn sm ghost" data-libraryio>导入 / 导出</button>`:""}</div></div>
    <div class="condgrid">${condLibrary.length?condLibrary.map(([n,d])=>`<div class="condentry ${managing?"managing":""} ${menuName===n?"menu-open":""}"><button class="cbtn" aria-pressed="${c.conds.includes(n)}" data-cond="${esc(n)}"><b>${esc(n)}</b><small>${esc(d)||"暂无规则摘要"}</small></button>${managing?`<button class="cond-more" data-condmenu="${esc(n)}" aria-label="管理${esc(n)}" aria-expanded="${menuName===n}">⋯</button>${menuName===n?`<div class="cond-menu" role="group" aria-label="${esc(n)}的管理操作"><button data-editcond="${esc(n)}">编辑资料</button><button class="danger" data-deletecond="${esc(n)}">${deletePending===n?"确认删除":"删除状态"}</button></div>`:""}`:""}</div>`).join(""):`<span class="empty-line">状态库为空，点击「＋ 新增」添加状态。</span>`}</div>
    ${editorOpen?`<div class="sec"><div class="cond-editor-toggle"><h3>新增 / 编辑状态资料</h3><button class="btn sm ghost" data-editor>收起</button></div>
      <div class="fields"><div class="field wide"><label for="m-custom">状态名</label><input id="m-custom" maxlength="80" value="${esc(customPending)}" placeholder="例如 受伤、流血"></div><div class="field wide"><label for="m-summary">规则摘要</label><textarea id="m-summary" maxlength="2000" rows="3" placeholder="描述此状态的规则效果">${esc(summaryPending)}</textarea></div></div>
      <div class="group" style="margin-top:8px"><button class="btn sm" data-savecustom>保存到状态库</button><button class="btn sm" data-addcustom>保存并添加给角色</button></div><p class="hint">同名保存会更新资料；角色已应用的规则摘要保持原样。可将状态库单独导出供其他团使用。</p>
    </div>
    `:""}
    <div class="sec"><div class="sec-h"><h3>角色当前状态</h3></div><div class="chips">${c.conds.length?c.conds.map(n=>`<span class="chip cond" title="${esc(condSummary(c,n))}">${esc(n)}${condLibrary.some(x=>x[0]===n)?"":`<button class="btn sm ghost" data-editcond="${esc(n)}" title="补充摘要并保存到状态库">存入库</button>`}<button class="x" data-custom-remove="${esc(n)}" aria-label="从角色移除${esc(n)}">×</button></span>`).join(""):`<span class="empty-line">无异常状态</span>`}</div></div>
    <div class="sec"><div class="sec-h"><h3>增益 / 减益</h3><button class="btn sm" data-addfx>＋ 效果</button></div><div class="chips">${c.fx.length?c.fx.map(f=>`<span class="chip ${f.kind}">${esc(f.name)}${f.rounds==null?"":" · "+f.rounds+"轮"}<button class="x" data-removefx="${esc(f.id)}" aria-label="移除${esc(f.name)}">×</button></span>`).join(""):`<span class="empty-line">没有增益或减益</span>`}</div></div>
    <div class="fields">
      <div class="field"><label>力竭等级（0–6）</label><span class="counter"><button data-exh="-1" aria-label="减少力竭">−</button><b>${c.exh}</b><button data-exh="1" aria-label="增加力竭">＋</button></span></div>
      ${multi?`<div class="field"><label>可同时专注</label><span class="counter"><button data-cm="-1" aria-label="减少专注上限">−</button><b>${c.concMax} 个</b><button data-cm="1" aria-label="增加专注上限">＋</button></span></div>`:""}
    </div>
    <div class="sec"><div class="sec-h"><h3>专注 ${c.concs.length}/${lim}</h3></div>
      <div class="chips">${c.concs.length?c.concs.map((n,i)=>`<span class="chip conc">${esc(n)}<button class="x" data-dc="${i}" aria-label="结束专注${esc(n)}">×</button></span>`).join(""):`<span class="empty-line">没有正在维持的专注</span>`}</div>
      <div class="concadd"><input id="m-conc" value="${esc(pending)}" placeholder="法术名，如 祝福" aria-label="开始专注的法术"><button class="btn sm" data-addconc>开始专注</button></div>
      <p class="hint">${multi?`多重专注已开启：${esc(c.name)} 最多同时维持 ${lim} 个专注，再开始新的专注时最早的那个结束。`:"标准规则：开始新的专注会结束原来的专注。"}</p>
    </div>
    <div class="mfoot"><button class="btn primary" data-x>完成</button></div>`;
  };
  const addCustom=(root,apply)=>{const n=root.querySelector("#m-custom").value.trim(),summary=root.querySelector("#m-summary").value.trim();if(!n||!summary){toast("请填写状态名和规则摘要。");root.querySelector(!n?"#m-custom":"#m-summary").focus();return}if(apply&&!guard())return;const next=condLibrary.map(x=>x.slice()),i=next.findIndex(x=>x[0]===n);if(i<0)next.push([n,summary]);else next[i]=[n,summary];if(!saveCondLibrary(next))return;if(apply)mutate(id,c=>setCond(c,n,summary));else render();customPending="";summaryPending="";editorOpen=false;draw(root);root.querySelector("[data-editor]").focus();toast(apply?"状态已保存并添加给角色。":"状态已保存，所有小队和角色均可选用。")};
  const addPending=root=>{const v=root.querySelector("#m-conc").value.trim();pending="";if(v)mutate(id,c=>addConc(c,v))};
  openModal("",root=>{
    draw(root);
    root.addEventListener("input",e=>{if(e.target.id==="m-conc")pending=e.target.value;if(e.target.id==="m-custom")customPending=e.target.value;if(e.target.id==="m-summary")summaryPending=e.target.value});
    root.addEventListener("keydown",e=>{if(e.key==="Escape"&&menuName!=null){e.preventDefault();e.stopPropagation();menuName=null;deletePending=null;draw(root);const b=root.querySelector("[data-managelib]");b&&b.focus();return}if(e.target.id==="m-custom"&&e.key==="Enter"){e.preventDefault();addCustom(root,false);return}if(e.target.id==="m-conc"&&e.key==="Enter"){e.preventDefault();addPending(root);draw(root);root.querySelector("#m-conc").focus()}});
    root.addEventListener("click",e=>{
      const t=e.target.closest("button");if(!t){if(menuName!=null&&!e.target.closest(".cond-menu")){menuName=null;deletePending=null;draw(root)}return}
      if(t.hasAttribute("data-managelib")){managing=!managing;menuName=null;deletePending=null;draw(root);root.querySelector("[data-managelib]").focus();return}
      if(t.hasAttribute("data-condmenu")){const n=t.dataset.condmenu;menuName=menuName===n?null:n;deletePending=null;draw(root);const b=root.querySelector(menuName!=null?"[data-editcond]":"[data-managelib]");b&&b.focus();return}
      if(t.hasAttribute("data-editor")){editorOpen=!editorOpen;menuName=null;deletePending=null;draw(root);root.querySelector(editorOpen?"#m-custom":"[data-editor]").focus();return}
      if(!t.hasAttribute("data-deletecond")&&!t.hasAttribute("data-editcond")){menuName=null;deletePending=null}
      if(t.hasAttribute("data-x")){addPending(root);modalClose();return}
      if(t.hasAttribute("data-libraryio")){condLibraryModal(doc);return}
      if(t.hasAttribute("data-addcustom")){addCustom(root,true);return}
      if(t.hasAttribute("data-savecustom")){addCustom(root,false);return}
      if(t.dataset.editcond!=null){const entry=condLibrary.find(x=>x[0]===t.dataset.editcond)||(c.conds.includes(t.dataset.editcond)?[t.dataset.editcond,condSummary(c,t.dataset.editcond)]:null);if(entry){customPending=entry[0];summaryPending=entry[1]}deletePending=null;menuName=null;editorOpen=true;draw(root);root.querySelector("#m-custom").focus();return}
      if(t.dataset.deletecond!=null){const n=t.dataset.deletecond;if(deletePending!==n){deletePending=n;draw(root);return}if(saveCondLibrary(condLibrary.filter(x=>x[0]!==n))){deletePending=null;menuName=null;render();draw(root);toast("已从状态库删除「"+n+"」。角色已有状态保留。")}return}
      deletePending=null;
      if(t.hasAttribute("data-addfx")){fxModal(id,doc);return}
      if(t.dataset.customRemove!=null)mutate(id,c=>{c.conds=c.conds.filter(n=>n!==t.dataset.customRemove)});
      if(t.dataset.removefx!=null)mutate(id,c=>{c.fx=c.fx.filter(f=>f.id!==t.dataset.removefx)});
      if(t.hasAttribute("data-addconc")){addPending(root);draw(root);root.querySelector("#m-conc").focus();return}
      if(t.dataset.dc!=null){mutate(id,c=>{c.concs.splice(int(t.dataset.dc),1)})}
      if(t.dataset.cm){mutate(id,c=>{c.concMax=clamp(c.concMax+int(t.dataset.cm),1,9);if(c.concs.length>c.concMax){const gone=c.concs.splice(0,c.concs.length-c.concMax);toast("专注上限降低，「"+gone.join("」「")+"」的专注结束。")}})}
      if(t.dataset.cond){const n=t.dataset.cond;mutate(id,c=>{if(c.conds.includes(n))c.conds=c.conds.filter(x=>x!==n);else setCond(c,n,(condLibrary.find(x=>x[0]===n)||[])[1]||"")})}
      if(t.dataset.exh){mutate(id,c=>{c.exh=clamp(c.exh+int(t.dataset.exh),0,6)})}
      draw(root);
    });
  },doc);
}

/* effect modal */
function fxModal(id,doc=document){
  const f={name:"",kind:"buff",rounds:10,ac:0,note:""};
  const targets=new Set([id]);
  const ids=sortedIds();
  const draw=root=>{
    root.innerHTML=`<h2>添加增益 / 减益</h2><p class="sub">点常用法术快速填入，或自己写。每到新一轮，持续轮数自动 −1，归零时移除。</p>
    <div class="presets">${FX_PRESETS.map((p,i)=>`<button class="chip ${p.kind}" data-pre="${i}"><span class="k">${p.kind==="buff"?"▲":"▼"}</span>${p.name}</button>`).join("")}</div>
    <div class="fields">
      <div class="field wide"><label for="f-name">名称</label><input id="f-name" data-f="name" value="${esc(f.name)}" placeholder="如 祝福、虚弱射线"></div>
      <div class="field"><label>类型</label><span class="seg"><button class="b" aria-pressed="${f.kind==="buff"}" data-kind="buff">增益</button><button class="d" aria-pressed="${f.kind==="debuff"}" data-kind="debuff">减益</button></span></div>
      <div class="field"><label for="f-r">持续轮数</label><input id="f-r" type="number" min="0" data-f="rounds" value="${f.rounds??""}" placeholder="留空 = 持续"></div>
      <div class="field"><label for="f-ac">AC 调整</label><input id="f-ac" type="number" data-f="ac" value="${f.ac}"></div>
      <div class="field wide"><label for="f-note">备注</label><input id="f-note" data-f="note" value="${esc(f.note)}" placeholder="效果说明，悬停可见"></div>
    </div>
    <div class="sec"><div class="sec-h"><h3>作用于</h3></div><div class="targets">${ids.map(i=>`<label><input type="checkbox" data-t="${i}" ${targets.has(i)?"checked":""}>${esc(S.chars[i].name)}</label>`).join("")}</div></div>
    <div class="mfoot"><button class="btn ghost" data-x>取消</button><button class="btn primary" data-add>添加</button></div>`;
  };
  openModal("",root=>{
    draw(root);
    root.addEventListener("input",e=>{const k=e.target.dataset.f;if(k)f[k]=k==="rounds"?(e.target.value===""?null:Math.max(0,int(e.target.value))):k==="ac"?int(e.target.value):e.target.value});
    root.addEventListener("change",e=>{const t=e.target.dataset.t;if(t){e.target.checked?targets.add(t):targets.delete(t)}});
    root.addEventListener("click",e=>{
      const t=e.target.closest("button");if(!t)return;
      if(t.hasAttribute("data-x"))modalClose();
      else if(t.dataset.pre!=null){Object.assign(f,FX_PRESETS[+t.dataset.pre]);draw(root)}
      else if(t.dataset.kind){f.kind=t.dataset.kind;draw(root)}
      else if(t.hasAttribute("data-add")){
        if(!f.name.trim()){root.querySelector("#f-name").focus();toast("先给效果起个名字。");return}
        if(!targets.size){toast("至少选择一个角色。");return}
        if(!guard())return;
        targets.forEach(tid=>{const c=S.chars[tid];if(!c)return;c.fx.push(Object.assign({id:uid()},clone(f)));S.chars[tid]=normalize(c);persist(tid)});
        modalClose();render();
      }
    });
  },doc);
}

/* import / export */
function ioModal(){
  const data=JSON.stringify({version:3,name:teamName(),rules:{spellSystem:S.meta.spellSystem,multiConc:S.meta.multiConc},classes:S.classes,conditionLibrary:condLibrary,chars:Object.values(S.chars).map(c=>{const o=clone(c);delete o.sample;return o})},null,1);
  openModal(`<h2>导入 / 导出</h2><p class="sub">下面是小队「${esc(teamName())}」的备份，复制保存即可。把备份粘贴回来后，可以替换当前小队，也可以导入成一个新的小队。备份里的自定义职业会按名称编号合并进来；备份包含状态库时会替换本浏览器的状态库。</p>
    <div class="field"><label for="io-t">小队数据（JSON）</label><textarea id="io-t" class="json">${esc(data)}</textarea></div>
    <div class="mfoot"><button class="btn left" data-copy>复制</button><button class="btn ghost" data-x>关闭</button><button class="btn" data-impnew>导入为新小队</button><button class="btn primary" data-imp>替换当前小队</button></div>`,root=>{
    const ta=root.querySelector("#io-t");
    root.querySelector("[data-x]").onclick=modalClose;
    root.querySelector("[data-copy]").onclick=()=>{
      const done=()=>toast("已复制到剪贴板。");
      try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast("请按 Ctrl/⌘ + C 复制已选中的内容。")})}catch(e){ta.select();toast("请按 Ctrl/⌘ + C 复制已选中的内容。")}
    };
    const parse=()=>{
      let parsed;try{parsed=JSON.parse(ta.value)}catch(e){toast("内容不是有效的 JSON，请检查是否完整粘贴。");return null}
      const list=Array.isArray(parsed)?parsed:Array.isArray(parsed.chars)?parsed.chars:Object.values(parsed.chars||{});
      if(!list.length){toast("没有找到角色数据。");return null}
      if(!guard())return null;
      if(parsed.classes&&typeof parsed.classes==="object"&&!Array.isArray(parsed.classes)){
        for(const[k,v]of Object.entries(parsed.classes)){if(/^[A-Za-z0-9_-]{1,60}$/.test(k)){S.classes[k]=normalizeClass(v);persist("k:"+k)}}
      }
      return {parsed,list};
    };
    const applyRules=(p)=>{if(p.conditionLibrary!=null){try{saveCondLibrary(cleanCondLibrary(p.conditionLibrary))}catch(e){toast("备份中的状态库格式无效，保留当前状态库。")}}const r=p.rules||{};if(r.spellSystem)S.meta.spellSystem=r.spellSystem==="points"?"points":"slots";if(typeof r.multiConc==="boolean")S.meta.multiConc=r.multiConc};
    root.querySelector("[data-imp]").onclick=()=>{
      const r=parse();if(!r)return;
      for(const k of Object.keys(S.chars)){delete S.chars[k];persist(k)}
      r.list.forEach((c,i)=>{const id="c"+uid();const n=normalize(c);n.created=n.created||Date.now()+i;S.chars[id]=n;persist(id)});
      applyRules(r.parsed);S.meta.turn=null;S.meta.round=0;persist("meta");
      modalClose();render();toast("已导入 "+r.list.length+" 名角色，替换了「"+teamName()+"」。");
    };
    root.querySelector("[data-impnew]").onclick=()=>{
      const r=parse();if(!r)return;
      const name=String(r.parsed.name||"导入的小队").slice(0,40);
      const tid=createTeam(name,r.list);
      if(tid){applyRules(r.parsed);persist("meta")}
      modalClose();render();toast("已导入为新小队「"+name+"」，共 "+r.list.length+" 名角色。");
    };
  });
}

/* ---------- events ---------- */
document.addEventListener("click",onClick);
function onClick(e){
  const t=e.target.closest("[data-act]");if(!t||t.tagName==="INPUT")return;
  const act=t.dataset.act,cardEl=t.closest("[data-id]"),id=cardEl&&cardEl.dataset.id;
  switch(act){
    case "add":return guard()&&editModal(null);
    case "pure":return pureToggle(t.ownerDocument);
    case "npc":return guard()&&npcModal(t.ownerDocument);
    case "edit":return editModal(id);
    case "conds":return condModal(id,t.ownerDocument);
    case "fx":return fxModal(id,t.ownerDocument);
    case "io":return ioModal();
    case "classes":return classesModal();
    case "pip":return togglePip();
    case "view":return setView(view==="mini"?"full":"mini");
    case "mhp":{
      const raw=String(miniAmt||"").trim();
      const n=raw===""?1:Math.abs(int(raw,NaN));
      if(!Number.isFinite(n)||!n){toast("请输入大于 0 的数值，留空则按 1 计算。");return}
      let msgs=[];
      mutate(id,c=>{if(t.dataset.kind==="dmg")msgs=applyDamage(c,n);else{if(c.hp===0)c.ds={s:0,f:0};c.hp=Math.min(c.maxHp,c.hp+n)}});
      msgs.forEach(toast);return;
    }
    case "next":return nextTurn();
    case "sort":return setMeta({sortInit:S.meta.sortInit===false});
    case "endcombat":return confirmModal("结束战斗","轮数清零，行动指示移除。角色身上的效果保持不变，可以手动移除。","结束战斗",()=>setMeta({round:0,turn:null}));
    case "rest":{
      if(!guard())return;
      const long=t.dataset.kind==="long";
      return confirmModal(long?"全队长休":"全队短休",long?"全员生命回满、临时生命清零、所有法术位与资源恢复、力竭降低 1 级、死亡豁免重置。":"恢复契约法术位和标为「短休」的资源。生命骰治疗请用每张卡上的「治疗」录入。",long?"开始长休":"开始短休",()=>rest(long?"long":"short"));
    }
    case "loadsample":{if(!guard())return;const s=sampleParty();for(const[k,v]of Object.entries(s)){S.chars[k]=v;persist(k)}render();return}
    case "clearsample":return confirmModal("清空示例角色","会删除所有标记为示例的角色，你添加的角色不受影响。","清空示例",()=>{for(const[k,v]of Object.entries(S.chars))if(v.sample){delete S.chars[k];persist(k)}if(!S.chars[S.meta.turn])S.meta.turn=null,S.meta.round=0,persist("meta");render()},true);
    case "hp":{
      const inp=cardEl.querySelector('[data-act="amt"]');const raw=String(inp.value||"").trim();
      const n=raw===""?1:Math.abs(int(raw,NaN));
      if(!Number.isFinite(n)||n===0){inp.focus();toast("请输入大于 0 的数值，留空则按 1 计算。");return}
      let msgs=[];
      mutate(id,c=>{
        if(t.dataset.kind==="dmg")msgs=applyDamage(c,n);
        else if(t.dataset.kind==="heal"){if(c.hp===0)c.ds={s:0,f:0};c.hp=Math.min(c.maxHp,c.hp+n)}
        else c.temp=Math.max(c.temp,n);
      });
      const el=document.querySelector(`#amt-${id}`);if(el)el.value="";
      msgs.forEach(toast);return;
    }
    case "slot":return mutate(id,c=>{const i=+t.dataset.i;c.used[i]=clamp(c.used[i]+int(t.dataset.d),0,c.slots[i])});
    case "pact":return mutate(id,c=>{c.pact.used=clamp(c.pact.used+int(t.dataset.d),0,c.pact.max)});
    case "res":return mutate(id,c=>{const r=c.res.find(x=>x.id===t.dataset.r);if(r)r.used=clamp(r.used+int(t.dataset.d),0,r.max)});
    case "ds":return mutate(id,c=>{const k=t.dataset.k;c.ds[k]=clamp(c.ds[k]+int(t.dataset.d),0,3);if(c.ds.s===3)toast(c.name+" 获得 3 次成功，伤势稳定。");if(c.ds.f===3)toast(c.name+" 累计 3 次失败，角色死亡。")});
    case "dropconc":return mutate(id,c=>{c.concs.splice(int(t.dataset.i),1);c.conc=c.concs[0]||""});
    case "uncond":return mutate(id,c=>{c.conds=c.conds.filter(x=>x!==t.dataset.n)});
    case "unfx":return mutate(id,c=>{c.fx=c.fx.filter(x=>x.id!==t.dataset.f)});
    case "prev":return prevTurn();
    case "rollall":return rollAll();
    case "rollinit":{let msg="";mutate(id,c=>{msg=rollInit(c)});if(msg)toast("先攻："+msg);return}
    case "pipinit":{
      clearTimeout(pipArmT);
      if(pipArm!=="init"){pipArm="init";pipArmT=setTimeout(()=>{pipArm=null;renderDocPip()},4000);renderDocPip();return}
      pipArm=null;return rollAll();
    }
    case "pipend":{
      clearTimeout(pipArmT);
      if(pipArm!=="end"){pipArm="end";pipArmT=setTimeout(()=>{pipArm=null;renderDocPip()},4000);renderDocPip();return}
      pipArm=null;if(!guard()){renderDocPip();return}
      setMeta({round:0,turn:null});toast("战斗结束，轮数已清零。");return;
    }
    case "piprest":{
      const k=t.dataset.kind==="long"?"long":"short";
      clearTimeout(pipArmT);
      if(pipArm!==k){pipArm=k;pipArmT=setTimeout(()=>{pipArm=null;renderDocPip()},4000);renderDocPip();return}
      pipArm=null;if(!guard()){renderDocPip();return}
      return rest(k);
    }
    case "settings":return settingsModal();
    case "sp":return mutate(id,c=>{c.spUsed=clamp(c.spUsed+int(t.dataset.d),0,spMax(c))});
    case "spcast":{
      const L=int(t.dataset.l),cost=SP_COST[L];
      return mutate(id,c=>{
        const left=spMax(c)-c.spUsed;
        if(left<cost){toast("法术点不足：施放 "+L+" 环需要 "+cost+" 点，剩余 "+left+" 点。");return}
        if(L>=6&&c.spHigh.includes(L)){toast(L+" 环法术本次长休前已经用过。");return}
        c.spUsed+=cost;if(L>=6)c.spHigh.push(L);
      });
    }
  }
}
document.addEventListener("change",onChange);
function onChange(e){
  const t=e.target;
  if(t.id==="teamSel"){
    const v=t.value;t.value=S.team||"";
    if(v==="__manage")teamsModal(false);
    else if(v==="__new")teamsModal(true);
    else if(v&&v!==S.team){switchTeam(v);toast("已切换到「"+teamName()+"」。")}
    return;
  }
  if(t.dataset.act==="initset"){
    const id=t.closest("[data-id]").dataset.id,raw=String(t.value).trim();
    if(raw===""||!S.chars[id])return;
    const v=clamp(int(raw),-20,60);
    if(t.classList.contains("mi-init")){t.readOnly=true;const h=t.closest(".init-handle");if(h)h.draggable=true}
    mutate(id,c=>{c.init=v;c.initPending=false;c.initRoll=[]});return;
  }
  if(t.dataset.act!=="initb")return;
  const id=t.closest("[data-id]").dataset.id;const v=clamp(int(t.value),-20,30);
  if(S.chars[id]&&S.chars[id].initBonus!==v)mutate(id,c=>{c.initBonus=v});
}
function onInput(e){if(e.target.id==="mini-amt")miniAmt=e.target.value}
document.addEventListener("input",onInput);
document.addEventListener("keydown",onKey);
function onKey(e){
  const t=e.target;
  if(t.classList&&t.classList.contains("mi-init")){
    if(e.key==="Enter"){e.preventDefault();if(t.readOnly)startInitEdit({target:t});else{finishInitEdit({target:t});t.blur()}return}
    if(e.key==="Escape"&&!t.readOnly){e.preventDefault();t.value=t.dataset.before||"";t.readOnly=true;const h=t.closest(".init-handle");if(h)h.draggable=true;t.blur();return}
  }
  if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("role")==="button"){e.preventDefault();t.click();return}
  if(e.key!=="Enter"||!t.dataset||t.dataset.act!=="amt")return;
  e.preventDefault();t.closest(".card").querySelector('[data-kind="dmg"]').click();
}

initStore();
})();
</script>
